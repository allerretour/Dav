<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Éditeur de diagramme</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <h1>Éditeur de diagramme</h1>
  <div class="container">
    <div class="top-section">
      <div class="file-input">
        <button onclick="saveToFile()"><i class="fas fa-save"></i> Sauvegarder</button>
        <button onclick="document.getElementById('fileInput').click()"><i class="fas fa-file-alt"></i> Restaurer</button>
        <button class="clear-button" onclick="clearSelections()"><i class="fas fa-eraser"></i> Effacer</button>
        <button onclick="toggleColors()"><i class="fas fa-palette"></i> Changer Couleurs</button>
        <input type="file" id="fileInput" accept=".csv" onchange="loadFromFile()" style="display:none;">
      </div>
    </div>
    <div class="input-field">
      <label for="title">Titre</label>
      <input type="text" id="title" placeholder="Entrez le titre">
    </div>
    <div class="input-field">
      <label for="description">Description</label>
      <textarea id="description" rows="4" placeholder="Entrez la description"></textarea>
    </div>
    <div class="main-content">
      <table class="compact-table">
        <thead>
          <tr>
            <th>#</th>
            <th>X</th>
            <th>Y</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="coordinatesTable"></tbody>
      </table>
      <div class="billiard-table" id="billiardTable">
        <div class="grid" id="grid"></div>
      </div>
    </div>
    <div class="coordinates-display" id="coordinatesDisplay">Cliquez sur une cellule pour voir les coordonnées.</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
